id = "ti.msp432p401r.blink_uart_demo"
target = "ti.msp432p401r"
default_config = "debug"
# Bare-metal, no RTOS - the "initial" bar (boots and runs its one demo),
# not the later full server-ready commitment. No vendor SDK/generator
# applies to this chip (see target.toml) - firmware is hand-written
# bare-metal C against the real DIO/eUSCI_A register set. See
# renoly_examples/ti/msp432p401r/README.md.
rtos = "none"

[configs.debug]
resc = "sim.resc"
firmware = "firmware/build/firmware.elf"

[configs.debug.build]
workdir = "firmware"
command = ["make", "all"]
artifact = "firmware/build/firmware.elf"
