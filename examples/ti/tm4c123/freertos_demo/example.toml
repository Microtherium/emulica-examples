id = "ti.tm4c123.freertos_demo"
target = "ti.tm4c123"
default_config = "debug"
# Real FreeRTOS (CMSIS-RTOS v1), two tasks - this chip's genuine
# Cortex-M4F core (unlike LM3S6965's Cortex-M3), so the real ARM_CM4F
# port applies, reused verbatim from stm32l476/freertos_demo's own
# already-proven bundle - no new port-fetch/frame-shape work needed
# (see README.md's own write-up). No vendor SDK/generator applies to
# this chip (see target.toml) - firmware is hand-written C against a
# real FreeRTOS V10.3.1 kernel. See renoly_examples/ti/tm4c123/README.md.
rtos = "freertos"

[configs.debug]
resc = "sim.resc"
firmware = "firmware/build/firmware.elf"

[configs.debug.build]
workdir = "firmware"
command = ["make", "all"]
artifact = "firmware/build/firmware.elf"
